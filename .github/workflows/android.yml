# Builds and tests the Android app on every pull request (no artifacts) and
# every push to main. A push to main (a merged pull request) also publishes
# the APK as the latest GitHub Release, at a link that never changes:
# https://github.com/mcbane23/guitar-learn-app/releases/latest/download/guitar-learn.apk
name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.35.4"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Check bundled songs match songs/
        working-directory: .
        run: diff -r songs app/assets/songs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A release build: compiled Dart instead of the debug interpreter, so
      # the app starts in a few seconds on a TV instead of ~20. It is signed
      # with the same key as before (app/android/app/keystore/debug.keystore),
      # so it installs as an update over the earlier builds and the in-app
      # updater keeps working.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # The APK always has the same name, so the link
      # https://github.com/mcbane23/guitar-learn-app/releases/latest/download/guitar-learn.apk
      # points at the newest build and the app can download updates from it.
      # version.json next to it tells the app which build is the newest.
      - name: Name the APK and write version.json
        id: apk
        working-directory: .
        run: |
          mkdir -p dist
          mv app/build/app/outputs/flutter-apk/app-release.apk dist/guitar-learn.apk
          cat > dist/version.json <<EOF
          {
            "build": ${{ github.run_number }},
            "tag": "build-${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "apk": "https://github.com/${{ github.repository }}/releases/latest/download/guitar-learn.apk"
          }
          EOF
          cat dist/version.json

      # Pull request builds only check that the app builds and the tests pass;
      # they publish nothing. A push to main (a merged pull request) publishes
      # the APK as the latest release.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          short_sha="$(git rev-parse --short HEAD)"
          gh release create "$tag" dist/guitar-learn.apk dist/version.json \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} ($short_sha)" \
            --notes "APK built from ${{ github.sha }}. Download guitar-learn.apk below on an Android phone, tablet or TV and open it to install (allow installing from unknown sources when asked). The app can also update itself from Settings. Fixed link to the newest build: https://github.com/${{ github.repository }}/releases/latest/download/guitar-learn.apk" \
            --latest
