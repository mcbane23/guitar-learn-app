# Builds and tests the Android app on every pull request (no artifacts) and
# every push to main. A push to main (a merged pull request) also publishes
# the APK as the latest GitHub Release, at a link that never changes:
# https://github.com/mcbane23/guitar-learn-app/releases/latest/download/guitar-learn.apk
name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.35.4"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Check bundled songs match songs/
        working-directory: .
        run: diff -r songs app/assets/songs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A release build: compiled Dart instead of the debug interpreter, so
      # the app starts in a few seconds on a TV instead of ~20. It is signed
      # with the same key as before (app/android/app/keystore/debug.keystore),
      # so it installs as an update over the earlier builds and the in-app
      # updater keeps working.
      #
      # Only the two ARM CPU types are built (no x86), the Dart code is
      # obfuscated and its debug symbols are kept out of the APK (they land in
      # build/symbols). Gradle (android/app/build.gradle.kts) turns the build
      # into three APKs: one per CPU type and a universal one with both.
      - name: Build release APKs
        run: >
          flutter build apk --release --build-number=${{ github.run_number }}
          --target-platform android-arm,android-arm64
          --obfuscate --split-debug-info=build/symbols
      - name: APK sizes
        run: ls -l build/app/outputs/flutter-apk/*.apk

      # The APKs always have the same names, so the link
      # https://github.com/mcbane23/guitar-learn-app/releases/latest/download/guitar-learn.apk
      # points at the newest build (the universal APK, which installs on every
      # device) and the app can download updates from it. version.json next to
      # it tells the app which build is the newest and, under "apks", the
      # smaller APK for each CPU type, which the updater prefers when it knows
      # the device's CPU type. Older builds only know "apk" and keep working.
      - name: Name the APKs and write version.json
        id: apk
        working-directory: .
        run: |
          mkdir -p dist
          out=app/build/app/outputs/flutter-apk
          mv "$out/app-release.apk" dist/guitar-learn.apk
          mv "$out/app-arm64-v8a-release.apk" dist/guitar-learn-arm64-v8a.apk
          mv "$out/app-armeabi-v7a-release.apk" dist/guitar-learn-armeabi-v7a.apk
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          cat > dist/version.json <<EOF
          {
            "build": ${{ github.run_number }},
            "tag": "build-${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "apk": "$base/guitar-learn.apk",
            "apks": {
              "arm64-v8a": "$base/guitar-learn-arm64-v8a.apk",
              "armeabi-v7a": "$base/guitar-learn-armeabi-v7a.apk"
            }
          }
          EOF
          cat dist/version.json
          ls -l dist

      # Pull request builds only check that the app builds and the tests pass;
      # they publish nothing. A push to main (a merged pull request) publishes
      # the APK as the latest release.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          short_sha="$(git rev-parse --short HEAD)"
          gh release create "$tag" dist/guitar-learn.apk dist/guitar-learn-arm64-v8a.apk dist/guitar-learn-armeabi-v7a.apk dist/version.json \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} ($short_sha)" \
            --notes "APK built from ${{ github.sha }}. Download guitar-learn.apk below on an Android phone, tablet or TV and open it to install (allow installing from unknown sources when asked). It installs on every device; guitar-learn-arm64-v8a.apk (most phones and tablets) and guitar-learn-armeabi-v7a.apk (32-bit TVs) are smaller downloads for one CPU type. The app can also update itself from Settings. Fixed link to the newest build: https://github.com/${{ github.repository }}/releases/latest/download/guitar-learn.apk" \
            --latest
